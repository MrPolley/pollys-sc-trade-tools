name: Update UEX Prices

on:
  schedule:
    # Every 6 hours. commodities_prices_all itself only refreshes every ~30-60 min
    # on UEX's side, so there's no benefit to running much more often than this.
    - cron: '0 */6 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch latest prices
        env:
          UEX_API_TOKEN: ${{ secrets.UEX_API_TOKEN }}
        run: python3 fetch_uex_prices.py

      - name: Commit updated data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          git diff --quiet --cached || git commit -m "Auto-update UEX prices ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push
